      if (cs) cs.setAttribute("content", mode);

    <script>
      (function () {
        var root = document.getElementById("harmony-photos-widget");
        if (!root) return;
        var img = root.querySelector(".ios-photos-widget__photo");
        if (!img) return;
        function reveal() {
          root.classList.add("is-ready");
          img.classList.add("is-active", "is-visible");
          root.dataset.firstReady = "1";
        }
        img.addEventListener("load", reveal, { once: true });
        img.addEventListener("error", function () {
          root.classList.add("is-pending");
        }, { once: true });
        if (img.complete && img.naturalWidth > 0) reveal();
      })();
    </script>
