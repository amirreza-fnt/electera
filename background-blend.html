<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="asset-version" content="20260927223759" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
  <title>Background blend — 5 modes</title>
  <meta name="theme-color" content="#ebe3d9" />
  <meta name="description" content="Five matte wallpaper blends — cream, gold, and harmonized glass-nav orbs." />
  <link rel="stylesheet" href="css/ios26-glass.css?v=20260927223759" />
  <link rel="stylesheet" href="css/background-blend-page.css?v=20260927223759" />
</head>
<body class="bg-blend-page ios-glass" data-variant="1">
  <div class="bg-blend-page__canvas" aria-hidden="true">
    <div class="bg-blend-page__solid"></div>
    <div class="bg-blend-page__ambient"></div>
    <div class="bg-blend-page__wall"></div>
    <div class="bg-blend-page__ios-wash"></div>
    <div class="bg-blend-page__blobs">
      <div class="bb-blob bb-blob--shadow"><span class="bb-blob__shape"></span></div>
      <div class="bb-blob bb-blob--glow-left"><span class="bb-blob__shape"></span></div>
      <div class="bb-blob bb-blob--gold-far"><span class="bb-blob__shape"></span></div>
      <div class="bb-blob bb-blob--warm-violet"><span class="bb-blob__shape"></span></div>
      <div class="bb-blob bb-blob--apricot"><span class="bb-blob__shape"></span></div>
      <div class="bb-blob bb-blob--honey"><span class="bb-blob__shape"></span></div>
      <div class="bb-blob bb-blob--rose-gold"><span class="bb-blob__shape"></span></div>
      <div class="bb-blob bb-blob--taupe"><span class="bb-blob__shape"></span></div>
      <div class="bb-blob bb-blob--bronze"><span class="bb-blob__shape"></span></div>
      <div class="bb-blob bb-blob--logo-glow"><span class="bb-blob__shape"></span></div>
    </div>
    <div class="bg-blend-page__matte"></div>
    <div class="bg-blend-page__vignette"></div>
    <div class="bg-blend-page__grain"></div>
  </div>

  <p class="bg-blend-page__toast" id="bg-blend-toast" role="status" aria-live="polite"></p>

  <button
    type="button"
    class="bg-blend-page__cycle ios-glass-btn ios-glass-btn--sm ios-glass-btn--dark"
    id="bg-blend-cycle"
    title="تغییر پس‌زمینه"
    aria-label="تغییر حالت پس‌زمینه"
  >
    <svg class="ios-glass-btn__glyph" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3Zm0 4a5 5 0 1 0 5 5h-2a3 3 0 1 1-3-3V7Zm0 3a2 2 0 1 0 2 2h-1a1 1 0 1 1-1-1V10Z" />
    </svg>
    <span class="bg-blend-page__cycle-num" id="bg-blend-num">1</span>
  </button>

  <script src="js/ios26-glass.js?v=20260927223759"></script>
  <script src="js/background-blend-page.js?v=20260927223759"></script>
</body>
</html>
