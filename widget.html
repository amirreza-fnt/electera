<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="asset-version" content="dev" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
  <title>ویجت — آزمایشگاه</title>
  <meta name="description" content="آزمایشگاه ویجت iOS — Photos و ویجت شیشه‌ای آموزشگاه." />
  <meta name="theme-color" content="#ebe3d9" />
  <meta name="color-scheme" content="light" />

  <link rel="stylesheet" href="css/fonts-yekan-bakh.css?v=20260927215101" />
  <link rel="stylesheet" href="css/widget-lab-page.css?v=20260927215101" />
</head>
<body class="widget-lab">
  <main class="widget-lab__main">
    <header class="widget-lab__head">
      <h1 class="widget-lab__title">آزمایشگاه ویجت</h1>
      <div class="widget-lab__tools" role="group" aria-label="حالت ظاهری">
        <button type="button" class="widget-lab__mode is-active" data-mode="light" aria-pressed="true">روشن</button>
        <button type="button" class="widget-lab__mode" data-mode="dark" aria-pressed="false">تاریک</button>
      </div>
    </header>

    <p class="widget-lab__hint">
      تصاویر را در <code dir="ltr">assets/widgets/</code> بگذارید:
      <code dir="ltr">widget-1.png</code>، <code dir="ltr">widget-2.png</code>، … (یا <code dir="ltr">widjet-*</code>)
    </p>

    <div class="widget-lab__stage" id="widget-stage">
      <div class="widget-lab__stage-block">
        <p class="widget-lab__stage-label">Photos</p>
      <article class="ios-photos-widget is-pending" id="photos-widget" data-appearance="light" aria-label="ویجت Photos — On This Day">
        <div class="ios-photos-widget__frame" id="widget-frame">
          <div class="ios-photos-widget__glass" aria-hidden="true"></div>
          <div class="ios-photos-widget__media" aria-hidden="true">
            <img class="ios-photos-widget__photo is-active" alt="" decoding="async" />
            <img class="ios-photos-widget__photo" alt="" decoding="async" />
          </div>
          <div class="ios-photos-widget__fx" aria-hidden="true"></div>
          <div class="ios-photos-widget__scrim" aria-hidden="true"></div>
          <div class="ios-photos-widget__copy">
            <p class="ios-photos-widget__eyebrow">ON THIS DAY</p>
            <p class="ios-photos-widget__date" id="widget-date"></p>
          </div>
        </div>
        <p class="ios-photos-widget__caption">Photos</p>
      </article>
      </div>

      <div class="widget-lab__stage-block">
        <p class="widget-lab__stage-label">آموزشگاه</p>
        <article
          class="ios-academy-widget"
          id="academy-widget"
          data-appearance="light"
          aria-label="ویجت آموزشگاه کامپیوتر"
        >
          <div class="ios-academy-widget__surface ios-liquid-glass" data-ios-liquid-glass>
            <div class="ios-liquid-glass__refract" aria-hidden="true"></div>
            <div class="ios-liquid-glass__tint" aria-hidden="true"></div>
            <div class="ios-liquid-glass__spec-top" aria-hidden="true"></div>
            <div class="ios-liquid-glass__rim" aria-hidden="true"></div>
            <div class="ios-liquid-glass__border" aria-hidden="true"></div>
            <div class="ios-academy-widget__inner">
              <h2 class="ios-academy-widget__title">بهترین آموزشگاه کامیپوتر سبزوار</h2>
              <ul class="ios-academy-widget__grid">
                <li>برنامه نویسی</li>
                <li>رباتیک</li>
                <li>هوش مصنوعی</li>
                <li>گرافیک</li>
              </ul>
              <p class="ios-academy-widget__footer">و کلی آموزش جذاب دیگه</p>
            </div>
          </div>
          <p class="ios-academy-widget__caption">Electera</p>
        </article>
      </div>
    </div>

    <p class="widget-lab__status" id="widget-status" aria-live="polite"></p>
  </main>

  <script src="js/ios-photos-widget.js?v=20260927215101" defer></script>
  <script src="js/ios-liquid-glass-panel.js?v=20260927215101" defer></script>
  <script src="js/widget-lab-page.js?v=20260927215101" defer></script>
</body>
</html>
