<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS Liquid Glass Progress Rings</title>
<style>
  * { box-sizing: border-box; }

  body{
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; margin:0; overflow:hidden;
    font-family:-apple-system, sans-serif;
    background: url('32.jpg') no-repeat center center/cover;
    background-attachment: fixed;
  }

  /* ===== کانتینر شیشه مایع ===== */
  .dashboard{
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    padding:30px;
    border-radius:40px;
    isolation:isolate;
    overflow:hidden;
  }

  /* لایه‌ای که JS واقعاً پیکسل‌های پشتش رو خم می‌کند (feImage + feDisplacementMap مبتنی بر SDF) */
  .dashboard .refract{
    position:absolute; inset:0; border-radius:inherit;
    background: rgba(255,255,255,.05);
  }
  .dashboard .tint{
    position:absolute; inset:0; border-radius:inherit;
    background: linear-gradient(150deg, rgba(255,255,255,.07), rgba(255,255,255,.01) 45%, rgba(0,0,0,.05) 100%);
  }

  /* قوس نور نازک فقط روی لبه‌ی بالا-چپ، نه یک هاله‌ی بزرگ سفید روی کل سطح */
  .dashboard .spec-top{
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    padding:1.5px;
    background: conic-gradient(from 210deg at 50% 50%,
      rgba(255,255,255,0) 0deg,
      rgba(255,255,255,.9) 35deg,
      rgba(255,255,255,0) 95deg,
      rgba(255,255,255,0) 260deg,
      rgba(255,255,255,.35) 305deg,
      rgba(255,255,255,0) 340deg);
    -webkit-mask: linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:.85;
    z-index:2;
  }

  .dashboard .rim{
    position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:2;
    box-shadow:
      inset 0 -1px 1px rgba(255,255,255,.10),
      inset 0 10px 22px rgba(0,0,0,.22),
      0 20px 50px rgba(0,0,0,.35),
      0 4px 12px rgba(0,0,0,.2);
  }
  .dashboard .border{
    position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:2;
    border:1px solid rgba(255,255,255,.3);
  }

  /* ===== دایره‌های پیشرفت ===== */
  .progress-ring{
    position:relative; width:100px; height:100px;
    display:flex; justify-content:center; align-items:center; z-index:3;
  }
  .progress-ring svg.ring{ transform:rotate(-90deg); width:100%; height:100%; display:block;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .ring-bg{ fill:none; stroke:rgba(255,255,255,.2); stroke-width:8; }
  .ring-progress{
    fill:none; stroke:#34c759; stroke-width:8; stroke-linecap:round;
    stroke-dasharray:251.33; stroke-dashoffset:251.33;
    transition:stroke-dashoffset 1s ease-in-out;
    filter:drop-shadow(0 0 4px rgba(52,199,89,.6));
  }
  .icon{
    position:absolute; width:26px; height:26px; top:50%; left:50%;
    transform:translate(-50%,-50%);
    fill:none; stroke:#ffffff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
    pointer-events:none; filter:drop-shadow(0 1px 3px rgba(0,0,0,.4));
  }
</style>
</head>
<body>

<div class="dashboard">
  <div class="refract"></div>
  <div class="tint"></div>
  <div class="spec-top"></div>
  <div class="rim"></div>
  <div class="border"></div>

  <div class="progress-ring">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
      <circle class="ring-progress" cx="50" cy="50" r="40" id="ring1"></circle>
    </svg>
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 20.94c1.5 0 2.75-1.25 3.25-2.5.5 1.25 1.75 2.5 3.25 2.5 2.5 0 4.5-2.5 4.5-6 0-4-4-8-6.5-8-1.5 0-2.5.5-3.5 1.5-1-1-2-1.5-3.5-1.5-2.5 0-6.5 4-6.5 8 0 3.5 2 6 4.5 6 1.5 0 2.75-1.25 3.25-2.5.5 1.25 1.75 2.5 3.25 2.5z"></path>
      <path d="M12 8.5c0-2 1-5 3-6"></path>
    </svg>
  </div>

  <div class="progress-ring">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
      <circle class="ring-progress" cx="50" cy="50" r="40" id="ring2"></circle>
    </svg>
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
    </svg>
  </div>

  <div class="progress-ring">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
      <circle class="ring-progress" cx="50" cy="50" r="40" id="ring3"></circle>
    </svg>
    <svg class="icon" viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="14" rx="2" ry="2"></rect>
      <line x1="2" y1="20" x2="22" y2="20"></line>
    </svg>
  </div>

  <div class="progress-ring">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
      <circle class="ring-progress" cx="50" cy="50" r="40" id="ring4"></circle>
    </svg>
    <svg class="icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7"></circle>
      <polyline points="12 9 12 12 13.5 13.5"></polyline>
      <path d="M16.51 17.35l-.35 3.83a2 2 0 0 1-2 1.82H9.83a2 2 0 0 1-2-1.82l-.35-3.83m.01-10.7l.35-3.83A2 2 0 0 1 9.83 1h4.33a2 2 0 0 1 2 1.82l.35 3.83"></path>
    </svg>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" id="filter-host"><defs></defs></svg>

<script>
/*
  الگوریتم واقعی Liquid Glass اپل (SDF-based)، به‌جای نویز تصادفی feTurbulence.
  وسط شیشه صاف می‌مونه، فقط نزدیک لبه‌ها پیکسل‌های پشت به سمت مرکز کشیده میشن → افکت لنزی/قطره‌ای واقعی.
  منبع الگوریتم: shuding/liquid-glass
*/
(function(){
  function roundedRectSDF(x, y, width, height, radius){
    const qx = Math.abs(x) - width + radius;
    const qy = Math.abs(y) - height + radius;
    return Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - radius;
  }
  function smoothStep(a, b, t){
    t = Math.max(0, Math.min(1, (t - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }
  function fragment(uv){
    const ix = uv.x - 0.5;
    const iy = uv.y - 0.5;
    const distanceToEdge = roundedRectSDF(ix, iy, 0.24, 0.24, 0.45);
    const displacement = smoothStep(0.72, 0, distanceToEdge - 0.1);
    const scaled = smoothStep(0, 1, displacement);
    return { x: ix * scaled + 0.5, y: iy * scaled + 0.5 };
  }

  function buildMap(w, h){
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(w, h);
    const raw = new Float32Array(w * h * 2);
    let maxScale = 0;

    for(let y = 0; y < h; y++){
      for(let x = 0; x < w; x++){
        const pos = fragment({ x: x / w, y: y / h });
        const dx = pos.x * w - x;
        const dy = pos.y * h - y;
        const idx = (y * w + x) * 2;
        raw[idx] = dx; raw[idx+1] = dy;
        maxScale = Math.max(maxScale, Math.abs(dx), Math.abs(dy));
      }
    }
    maxScale = maxScale || 1;
    for(let i = 0, p = 0; i < raw.length; i += 2, p += 4){
      imgData.data[p]   = (raw[i]   / maxScale) * 127.5 + 127.5;
      imgData.data[p+1] = (raw[i+1] / maxScale) * 127.5 + 127.5;
      imgData.data[p+2] = 127;
      imgData.data[p+3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    return { url: canvas.toDataURL(), scale: maxScale * 1.9 };
  }

  const defs = document.querySelector('#filter-host defs');

  function apply(el){
    const w = Math.max(1, Math.round(el.offsetWidth));
    const h = Math.max(1, Math.round(el.offsetHeight));
    const map = buildMap(Math.min(w, 260), Math.min(h, 260));
    const id = 'liquid-glass-filter';

    let filter = document.getElementById(id);
    if(!filter){
      filter = document.createElementNS('http://www.w3.org/2000/svg','filter');
      filter.setAttribute('id', id);
      filter.setAttribute('x','-20%'); filter.setAttribute('y','-20%');
      filter.setAttribute('width','140%'); filter.setAttribute('height','140%');
      filter.setAttribute('color-interpolation-filters','sRGB');

      const feImage = document.createElementNS('http://www.w3.org/2000/svg','feImage');
      feImage.setAttribute('result','map');
      feImage.setAttribute('preserveAspectRatio','none');

      const feDisp = document.createElementNS('http://www.w3.org/2000/svg','feDisplacementMap');
      feDisp.setAttribute('in','SourceGraphic');
      feDisp.setAttribute('in2','map');
      feDisp.setAttribute('xChannelSelector','R');
      feDisp.setAttribute('yChannelSelector','G');

      filter.appendChild(feImage);
      filter.appendChild(feDisp);
      defs.appendChild(filter);
    }
    filter.querySelector('feImage').setAttributeNS('http://www.w3.org/1999/xlink','href', map.url);
    filter.querySelector('feDisplacementMap').setAttribute('scale', map.scale.toFixed(1));

    const refract = el.querySelector('.refract');
    refract.style.backdropFilter = `url(#${id}) blur(2px) contrast(1.05) brightness(1.02) saturate(1.1)`;
    refract.style.webkitBackdropFilter = 'blur(9px) saturate(1.15)'; // Safari fallback: بلور ساده
  }

  function refreshAll(){ apply(document.querySelector('.dashboard')); }

  window.addEventListener('load', refreshAll);
  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(refreshAll, 150); });
})();

const percentRing1 = 14, percentRing2 = 65, percentRing3 = 80, percentRing4 = 45;
function setProgress(elementId, percent){
  const circle = document.getElementById(elementId);
  if (!circle) return;
  if (percent > 100) percent = 100;
  if (percent < 0) percent = 0;
  const radius = 40;
  const circumference = 2 * Math.PI * radius;
  circle.style.strokeDashoffset = circumference - (percent / 100) * circumference;
}
setProgress('ring1', percentRing1);
setProgress('ring2', percentRing2);
setProgress('ring3', percentRing3);
setProgress('ring4', percentRing4);
</script>

</body>
</html>
