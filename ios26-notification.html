<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="asset-version" content="20260927215101" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
  <title>iOS 26 Notification</title>
  <meta name="description" content="An iOS 26 lock-screen notification that wakes the screen and rises in sync with its alert sound." />
  <meta name="theme-color" content="#0a0a0c" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/ios26-glass.css?v=20260927215101" />
  <link rel="stylesheet" href="css/ios26-screen.css?v=20260927215101" />
  <link rel="stylesheet" href="css/ios26-notification-page.css?v=20260927215101" />
</head>
<body class="ios-page ios-glass ios-notif-page" data-appearance="dark">
  <main class="ios-device-wrap">
    <h1 class="ios-sr">iOS 26 notification demo</h1>

    <div class="ios-device">
      <div class="ios-screen is-asleep" id="ios-screen" data-appearance="light">
        <div class="ios-island" aria-hidden="true"></div>

        <div class="ios-status" aria-hidden="true">
          <svg viewBox="0 0 20 13"><rect x="0" y="9" width="3.4" height="4" rx="0.8"/><rect x="5.4" y="6.5" width="3.4" height="6.5" rx="0.8"/><rect x="10.8" y="3.5" width="3.4" height="9.5" rx="0.8"/><rect x="16.2" y="0.5" width="3.4" height="12.5" rx="0.8"/></svg>
          <svg viewBox="0 0 18 13"><path d="M9 3.2c2.6 0 4.9 1 6.7 2.6l1.3-1.5A11.6 11.6 0 0 0 9 1 11.6 11.6 0 0 0 1 4.3l1.3 1.5A9.6 9.6 0 0 1 9 3.2Zm0 3.4c1.7 0 3.2.6 4.4 1.7l1.3-1.5A8.2 8.2 0 0 0 9 4.7a8.2 8.2 0 0 0-5.7 2.1l1.3 1.5A6.2 6.2 0 0 1 9 6.6Zm0 3.4c.8 0 1.5.3 2 .8L9 13l-2-2.2c.5-.5 1.2-.8 2-.8Z"/></svg>
          <svg viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="2" y="2" width="20" height="9" rx="2.2"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" opacity="0.45"/></svg>
        </div>

        <!-- Replay (page utility) -->
        <div class="ios-corner">
          <button class="ios-glass-btn ios-glass-btn--sm ios-glass-btn--dark" type="button" id="ios-replay" aria-label="Replay notification" title="Replay (R)">
            <span class="ios-glass-btn__glyph"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></svg></span>
          </button>
        </div>

        <div class="ios-clock" aria-hidden="true">
          <span class="ios-clock__date">Sunday, September 27</span>
          <time class="ios-clock__time">9:41</time>
        </div>

        <!-- Notification stack (bottom, iOS 26 lock screen) -->
        <div class="ios-notif-stack" id="ios-notif-stack"></div>

        <div class="ios-lock-actions">
          <button class="ios-glass-btn ios-glass-btn--dark" type="button" data-toggle aria-pressed="false" aria-label="Flashlight">
            <span class="ios-glass-btn__glyph">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path data-fill fill-rule="evenodd" d="M8.5 2.5A1.5 1.5 0 0 0 7 4v1.3c0 .5.13.98.38 1.4L9 9.5c.16.28.25.6.25.93V20.5a1.5 1.5 0 0 0 1.5 1.5h2.5a1.5 1.5 0 0 0 1.5-1.5V10.43c0-.33.09-.65.25-.93l1.62-2.8c.25-.42.38-.9.38-1.4V4a1.5 1.5 0 0 0-1.5-1.5h-7ZM12 12.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z"/><path d="M7 6.5h10" stroke-width="1.3"/></svg>
            </span>
          </button>
          <button class="ios-glass-btn ios-glass-btn--dark" type="button" aria-label="Camera">
            <span class="ios-glass-btn__glyph">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path data-fill fill-rule="evenodd" d="M9.3 4a1 1 0 0 0-.83.45L7.4 6.1a1 1 0 0 1-.83.45H4.5A2.5 2.5 0 0 0 2 9.05v8.4A2.5 2.5 0 0 0 4.5 20h15a2.5 2.5 0 0 0 2.5-2.5v-8.45A2.5 2.5 0 0 0 19.5 6.55h-2.07a1 1 0 0 1-.83-.45l-1.07-1.65A1 1 0 0 0 14.7 4H9.3ZM12 9a4.25 4.25 0 1 0 0 8.5A4.25 4.25 0 0 0 12 9Zm0 1.8a2.45 2.45 0 1 1 0 4.9 2.45 2.45 0 0 1 0-4.9Z"/></svg>
            </span>
          </button>
        </div>

        <div class="ios-home-indicator" aria-hidden="true"></div>

        <!-- Screen dim layer (asleep → wake) -->
        <div class="ios-screen__dim" aria-hidden="true"></div>

        <!-- Shown only when the browser blocks autoplay -->
        <button class="ios-glass-btn ios-glass-btn--pill ios-notif-page__unlock" type="button" id="ios-sound-unlock" hidden>
          <span class="ios-glass-btn__glyph"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4.2 3.3a.8.8 0 0 0 1.2-.7V5.9a.8.8 0 0 0-1.2-.7L7.6 8.5H5a1 1 0 0 0-1 1Z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5M18.6 7a7 7 0 0 1 0 10"/></svg></span>
          <span class="ios-glass-btn__label">Tap to enable sound</span>
        </button>
      </div>
    </div>
  </main>

  <audio id="ios-notif-audio" src="notif.mp3" preload="auto"></audio>

  <script src="js/ios26-glass.js?v=20260927215101" defer></script>
  <script src="js/ios26-notification.js?v=20260927215101" defer></script>
</body>
</html>
